<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Daniel Ajayi Lotsu</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#020a02">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020a02; --surface:#06140a; --text:#eefff0; --text-2:#7fcc66; --text-3:#4d8c3c;
    --border:#173311; --primary:#6AFF00; --glow:rgba(106,255,0,.5);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px;background:var(--bg);color:var(--text);
    font-family:'JetBrains Mono',ui-monospace,monospace;
  }
  .grid{
    position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(106,255,0,.06) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(106,255,0,.06) 1px,transparent 1px);
    background-size:54px 54px;
    mask-image:radial-gradient(circle at 50% 40%,#000,transparent 78%);
  }
  .card{position:relative;max-width:520px;text-align:center}
  .code{
    display:inline-flex;align-items:center;gap:8px;font-family:'Syne Mono',monospace;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);
    background:rgba(106,255,0,.08);border:1px solid var(--border);
    padding:7px 14px;border-radius:999px;margin-bottom:22px;
  }
  h1{
    font-size:clamp(30px,7vw,54px);line-height:1.05;letter-spacing:-2px;margin:0 0 16px;
    font-weight:700;color:var(--primary);text-shadow:0 0 38px var(--glow);
  }
  p{margin:0 0 28px;font-size:15px;line-height:1.7;color:var(--text-2)}
  .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;
    padding:13px 24px;border-radius:999px;transition:transform .15s ease,background .15s ease;
  }
  a.primary{color:#04120a;background:var(--primary);font-weight:700;box-shadow:0 14px 40px -12px var(--glow)}
  a.ghost{color:var(--text);border:1px solid var(--primary)}
  a:hover{transform:translateY(-2px)}
  a.ghost:hover{background:rgba(106,255,0,.08)}
  :focus-visible{outline:2px solid var(--primary);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<main class="card">
  <span class="code">404 · no such resource</span>
  <h1>This page never deployed</h1>
  <p>
    The address you followed doesn't match anything on this site. It may have moved,
    or the link may have been mistyped.
  </p>
  <div class="links">
    <a class="primary" href="/">Back to the portfolio</a>
    <a class="ghost" href="/blog">Read the field notes</a>
  </div>
</main>
</body>
</html>
