<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="405" viewBox="0 0 1080 405" role="img" aria-label="Wide chart: a tall 214 millisecond cold start followed by warm invocations settling under 90 milliseconds">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace }
    .warm { animation: rise .9s cubic-bezier(.16,1,.3,1) both; transform-origin: 50% 100% }
    .warm:nth-of-type(2) { animation-delay: .05s } .warm:nth-of-type(3) { animation-delay: .10s }
    .warm:nth-of-type(4) { animation-delay: .15s } .warm:nth-of-type(5) { animation-delay: .20s }
    .warm:nth-of-type(6) { animation-delay: .25s } .warm:nth-of-type(7) { animation-delay: .30s }
    .warm:nth-of-type(8) { animation-delay: .35s }
    @keyframes rise { from { transform: scaleY(0); opacity: 0 } to { transform: scaleY(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .warm { animation: none } }
  </style>
  <defs>
    <pattern id="cc-grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0v45" fill="none" stroke="#6AFF00" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="cc-cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6AFF00"/><stop offset="1" stop-color="#2f8f00"/>
    </linearGradient>
    <radialGradient id="cc-glow" cx=".28" cy=".4" r=".7">
      <stop offset="0" stop-color="#6AFF00" stop-opacity=".2"/><stop offset="1" stop-color="#6AFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="405" fill="#06140a"/>
  <rect width="1080" height="405" fill="url(#cc-grid)"/>
  <rect width="1080" height="405" fill="url(#cc-glow)"/>

  <!-- left: the headline stat -->
  <rect x="60" y="96" width="52" height="52" rx="13" fill="#0b1f0a" stroke="#173311"/>
  <text class="mono" x="86" y="132" font-size="26" fill="#6AFF00" text-anchor="middle">&#955;</text>
  <text class="mono" x="60" y="192" font-size="23" fill="#eefff0">invocation latency</text>
  <text class="mono" x="60" y="220" font-size="14" fill="#7fcc66">leave-mgmt-api &#183; af-west-1</text>
  <text class="mono" x="60" y="300" font-size="52" font-weight="700" fill="#6AFF00">&#8722;60%</text>
  <text class="mono" x="60" y="328" font-size="13" fill="#7fcc66">214ms cold &#8594; 88ms warm</text>

  <!-- right: the chart -->
  <line x1="470" y1="330" x2="1030" y2="330" stroke="#173311" stroke-width="1.5"/>
  <line x1="470" y1="220" x2="1030" y2="220" stroke="#6AFF00" stroke-opacity=".38" stroke-dasharray="7 7"/>
  <text class="mono" x="1030" y="212" font-size="11" fill="#7fcc66" text-anchor="end">p99 118ms</text>

  <rect x="480" y="130" width="44" height="200" rx="5" fill="url(#cc-cold)"/>
  <text class="mono" x="502" y="119" font-size="12" fill="#6AFF00" text-anchor="middle">214ms</text>
  <text class="mono" x="502" y="352" font-size="10.5" fill="#7fcc66" text-anchor="middle">cold</text>

  <g fill="#6AFF00" fill-opacity=".42">
    <rect class="warm" x="542" y="220" width="44" height="110" rx="5"/>
    <rect class="warm" x="604" y="240" width="44" height="90" rx="5"/>
    <rect class="warm" x="666" y="248" width="44" height="82" rx="5"/>
    <rect class="warm" x="728" y="244" width="44" height="86" rx="5"/>
    <rect class="warm" x="790" y="251" width="44" height="79" rx="5"/>
    <rect class="warm" x="852" y="246" width="44" height="84" rx="5"/>
    <rect class="warm" x="914" y="250" width="44" height="80" rx="5"/>
    <rect class="warm" x="976" y="248" width="44" height="82" rx="5"/>
  </g>
  <text class="mono" x="781" y="352" font-size="10.5" fill="#7fcc66" text-anchor="middle">warm &#183; container reused</text>
</svg>
