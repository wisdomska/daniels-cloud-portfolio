<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Chart of Lambda invocation latency: a 214 millisecond cold start followed by warm invocations under 90 milliseconds">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace }
    .warm { animation: rise .9s cubic-bezier(.16,1,.3,1) both; transform-origin: 50% 100% }
    .warm:nth-of-type(2) { animation-delay: .06s } .warm:nth-of-type(3) { animation-delay: .12s }
    .warm:nth-of-type(4) { animation-delay: .18s } .warm:nth-of-type(5) { animation-delay: .24s }
    .warm:nth-of-type(6) { animation-delay: .30s } .warm:nth-of-type(7) { animation-delay: .36s }
    .warm:nth-of-type(8) { animation-delay: .42s }
    @keyframes rise { from { transform: scaleY(0); opacity: 0 } to { transform: scaleY(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .warm { animation: none } }
  </style>
  <defs>
    <pattern id="ch-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#6AFF00" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="ch-cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6AFF00"/><stop offset="1" stop-color="#2f8f00"/>
    </linearGradient>
    <radialGradient id="ch-glow" cx=".18" cy=".05" r=".85">
      <stop offset="0" stop-color="#6AFF00" stop-opacity=".22"/><stop offset="1" stop-color="#6AFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="#06140a"/>
  <rect width="960" height="540" fill="url(#ch-grid)"/>
  <rect width="960" height="540" fill="url(#ch-glow)"/>

  <rect x="56" y="44" width="52" height="52" rx="13" fill="#0b1f0a" stroke="#173311"/>
  <text class="mono" x="82" y="80" font-size="26" fill="#6AFF00" text-anchor="middle">&#955;</text>
  <text class="mono" x="124" y="68" font-size="20" fill="#eefff0">invocation latency</text>
  <text class="mono" x="124" y="90" font-size="13" fill="#7fcc66">leave-mgmt-api &#183; af-west-1 &#183; p99 118ms</text>

  <line x1="56" y1="450" x2="904" y2="450" stroke="#173311" stroke-width="1.5"/>
  <line x1="56" y1="307" x2="904" y2="307" stroke="#6AFF00" stroke-opacity=".38" stroke-dasharray="8 8"/>
  <text class="mono" x="904" y="298" font-size="12" fill="#7fcc66" text-anchor="end">p99</text>

  <rect x="106" y="190" width="60" height="260" rx="6" fill="url(#ch-cold)"/>
  <text class="mono" x="136" y="176" font-size="14" fill="#6AFF00" text-anchor="middle">214ms</text>
  <text class="mono" x="136" y="476" font-size="12" fill="#7fcc66" text-anchor="middle">cold</text>

  <g fill="#6AFF00" fill-opacity=".42">
    <rect class="warm" x="192" y="307" width="60" height="143" rx="6"/>
    <rect class="warm" x="278" y="333" width="60" height="117" rx="6"/>
    <rect class="warm" x="364" y="343" width="60" height="107" rx="6"/>
    <rect class="warm" x="450" y="338" width="60" height="112" rx="6"/>
    <rect class="warm" x="536" y="348" width="60" height="102" rx="6"/>
    <rect class="warm" x="622" y="341" width="60" height="109" rx="6"/>
    <rect class="warm" x="708" y="346" width="60" height="104" rx="6"/>
    <rect class="warm" x="794" y="343" width="60" height="107" rx="6"/>
  </g>
  <text class="mono" x="523" y="476" font-size="12" fill="#7fcc66" text-anchor="middle">warm &#183; container reused</text>
  <text class="mono" x="56" y="512" font-size="11.5" fill="#4d8c3c">measure before you optimise</text>
</svg>
