<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-label="A rising curve from 2024 to 2025 ending in a star, marking two AWS certifications">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace }
    .trace { stroke-dasharray: 700; animation: draw 2s cubic-bezier(.16,1,.3,1) both }
    @keyframes draw { from { stroke-dashoffset: 700 } to { stroke-dashoffset: 0 } }
    .node { animation: pop .5s cubic-bezier(.16,1,.3,1) both }
    .node:nth-of-type(1) { animation-delay: .8s } .node:nth-of-type(2) { animation-delay: 1.4s }
    @keyframes pop { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: scale(1) } }
    @media (prefers-reduced-motion: reduce) { .trace, .node { animation: none } }
  </style>
  <defs>
    <pattern id="ft-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#6AFF00" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="ft-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8f00"/><stop offset="1" stop-color="#6AFF00"/>
    </linearGradient>
    <linearGradient id="ft-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6AFF00" stop-opacity=".24"/><stop offset="1" stop-color="#6AFF00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#06140a"/>
  <rect width="600" height="450" fill="url(#ft-grid)"/>

  <text class="mono" x="300" y="62" font-size="24" fill="#7fcc66" text-anchor="middle">year one</text>

  <path d="M70 320 C220 316 236 216 340 208 C444 200 452 148 520 138 V350 H70 Z" fill="url(#ft-fill)"/>
  <path class="trace" d="M70 320 C220 316 236 216 340 208 C444 200 452 148 520 138"
        fill="none" stroke="url(#ft-line)" stroke-width="5" stroke-linecap="round"/>

  <line x1="46" y1="350" x2="554" y2="350" stroke="#173311" stroke-width="2"/>

  <g class="node" style="transform-origin:340px 208px">
    <circle cx="340" cy="208" r="14" fill="#0b1f0a" stroke="#6AFF00" stroke-width="3"/>
    <path d="M332 208 l6 6 10-12" fill="none" stroke="#6AFF00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="node" style="transform-origin:520px 138px">
    <circle cx="520" cy="138" r="20" fill="#0b1f0a" stroke="#6AFF00" stroke-width="3"/>
    <path d="M520 124 l4 8.2 9.1 1.3-6.6 6.4 1.6 9.1-8.1-4.3-8.1 4.3 1.6-9.1-6.6-6.4 9.1-1.3z" fill="#6AFF00"/>
  </g>

  <text class="mono" x="300" y="406" font-size="26" fill="#eefff0" text-anchor="middle">2024 &#8594; 2025</text>
</svg>
