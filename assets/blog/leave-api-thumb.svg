<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-label="Three stacked services — gateway, requests, balances — connected top to bottom">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace }
    .flow { stroke-dasharray: 8 7; animation: dash 1.4s linear infinite }
    @keyframes dash { to { stroke-dashoffset: -30 } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none } }
  </style>
  <defs>
    <pattern id="lt-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#6AFF00" stroke-opacity=".08"/>
    </pattern>
    <radialGradient id="lt-glow" cx=".5" cy=".5" r=".65">
      <stop offset="0" stop-color="#6AFF00" stop-opacity=".18"/><stop offset="1" stop-color="#6AFF00" stop-opacity="0"/>
    </radialGradient>
    <marker id="lt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6AFF00" fill-opacity=".9"/>
    </marker>
  </defs>

  <rect width="600" height="450" fill="#06140a"/>
  <rect width="600" height="450" fill="url(#lt-grid)"/>
  <rect width="600" height="450" fill="url(#lt-glow)"/>

  <g class="flow" fill="none" stroke="#6AFF00" stroke-opacity=".6" stroke-width="3" marker-end="url(#lt-arrow)">
    <path d="M300 176 V214"/>
    <path d="M300 296 V334"/>
  </g>

  <rect x="120" y="106" width="360" height="70" rx="16" fill="#0b1f0a" stroke="#6AFF00" stroke-opacity=".6" stroke-width="2"/>
  <text class="mono" x="300" y="149" font-size="28" fill="#6AFF00" text-anchor="middle">gateway</text>

  <rect x="120" y="226" width="360" height="70" rx="16" fill="#0b1f0a" stroke="#173311" stroke-width="2"/>
  <text class="mono" x="300" y="269" font-size="28" fill="#eefff0" text-anchor="middle">requests</text>

  <rect x="120" y="346" width="360" height="70" rx="16" fill="#0b1f0a" stroke="#173311" stroke-width="2"/>
  <text class="mono" x="300" y="389" font-size="28" fill="#eefff0" text-anchor="middle">balances</text>

  <text class="mono" x="300" y="66" font-size="24" fill="#7fcc66" text-anchor="middle">service seams</text>
</svg>
