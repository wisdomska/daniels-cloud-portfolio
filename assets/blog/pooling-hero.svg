<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Diagram: many Lambda containers multiplexed through RDS Proxy onto three stable PostgreSQL connections">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace }
    .flow { stroke-dasharray: 9 8; animation: dash 1.5s linear infinite }
    @keyframes dash { to { stroke-dashoffset: -34 } }
    .blip { animation: pulse 2.4s ease-in-out infinite }
    .blip:nth-of-type(even) { animation-delay: .5s }
    @keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .flow, .blip { animation: none } }
  </style>
  <defs>
    <pattern id="ph-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#6AFF00" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="ph-glow" cx=".45" cy=".55" r=".6">
      <stop offset="0" stop-color="#6AFF00" stop-opacity=".17"/><stop offset="1" stop-color="#6AFF00" stop-opacity="0"/>
    </radialGradient>
    <marker id="ph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6AFF00" fill-opacity=".85"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#06140a"/>
  <rect width="960" height="540" fill="url(#ph-grid)"/>
  <rect width="960" height="540" fill="url(#ph-glow)"/>

  <text class="mono" x="56" y="62" font-size="20" fill="#eefff0">connection multiplexing</text>
  <text class="mono" x="56" y="86" font-size="13" fill="#7fcc66">1000s of short-lived containers &#8594; a small, stable pool</text>

  <!-- lambda containers -->
  <g>
    <rect class="blip" x="56" y="140" width="96" height="42" rx="10" fill="#0b1f0a" stroke="#173311"/>
    <rect class="blip" x="56" y="196" width="96" height="42" rx="10" fill="#0b1f0a" stroke="#173311"/>
    <rect class="blip" x="56" y="252" width="96" height="42" rx="10" fill="#0b1f0a" stroke="#173311"/>
    <rect class="blip" x="56" y="308" width="96" height="42" rx="10" fill="#0b1f0a" stroke="#173311"/>
    <rect class="blip" x="56" y="364" width="96" height="42" rx="10" fill="#0b1f0a" stroke="#173311"/>
  </g>
  <g class="mono" font-size="17" fill="#6AFF00" text-anchor="middle">
    <text x="104" y="167">&#955;</text><text x="104" y="223">&#955;</text><text x="104" y="279">&#955;</text>
    <text x="104" y="335">&#955;</text><text x="104" y="391">&#955;</text>
  </g>
  <text class="mono" x="104" y="432" font-size="11.5" fill="#7fcc66" text-anchor="middle">pool max: 2</text>

  <!-- converging -->
  <g class="flow" fill="none" stroke="#6AFF00" stroke-opacity=".4" stroke-width="1.5">
    <path d="M152 161 C260 161 300 240 348 258"/>
    <path d="M152 217 C260 217 300 262 348 268"/>
    <path d="M152 273 H348"/>
    <path d="M152 329 C260 329 300 284 348 278"/>
    <path d="M152 385 C260 385 300 306 348 288"/>
  </g>

  <!-- rds proxy -->
  <rect x="348" y="238" width="216" height="72" rx="36" fill="#0b1f0a" stroke="#6AFF00" stroke-opacity=".6"/>
  <text class="mono" x="456" y="270" font-size="16" fill="#6AFF00" text-anchor="middle">RDS Proxy</text>
  <text class="mono" x="456" y="292" font-size="11" fill="#7fcc66" text-anchor="middle">multiplex &#183; failover</text>

  <!-- three stable connections -->
  <g fill="none" stroke="#6AFF00" stroke-opacity=".65" stroke-width="1.9" marker-end="url(#ph-arrow)">
    <path d="M564 256 C650 256 680 244 712 240"/>
    <path d="M564 274 H712"/>
    <path d="M564 292 C650 292 680 304 712 308"/>
  </g>
  <text class="mono" x="638" y="340" font-size="11.5" fill="#7fcc66" text-anchor="middle">3 connections</text>

  <!-- postgres -->
  <g>
    <ellipse cx="790" cy="248" rx="68" ry="19" fill="#0b1f0a" stroke="#173311"/>
    <path d="M722 248v62c0 10.5 30.4 19 68 19s68-8.5 68-19v-62" fill="#0b1f0a" stroke="#173311"/>
    <ellipse cx="790" cy="248" rx="68" ry="19" fill="none" stroke="#6AFF00" stroke-opacity=".45"/>
    <text class="mono" x="790" y="292" font-size="14" fill="#eefff0" text-anchor="middle">PostgreSQL</text>
    <text class="mono" x="790" y="312" font-size="10.5" fill="#7fcc66" text-anchor="middle">limit intact</text>
  </g>

  <text class="mono" x="56" y="500" font-size="11.5" fill="#4d8c3c">a pool per container just multiplies the problem</text>
</svg>
