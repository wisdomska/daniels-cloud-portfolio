<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-label="Four Lambda containers funnelling through a proxy into a single PostgreSQL database">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace }
    .flow { stroke-dasharray: 8 7; animation: dash 1.4s linear infinite }
    @keyframes dash { to { stroke-dashoffset: -30 } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none } }
  </style>
  <defs>
    <pattern id="pt-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#6AFF00" stroke-opacity=".08"/>
    </pattern>
    <radialGradient id="pt-glow" cx=".45" cy=".5" r=".65">
      <stop offset="0" stop-color="#6AFF00" stop-opacity=".18"/><stop offset="1" stop-color="#6AFF00" stop-opacity="0"/>
    </radialGradient>
    <marker id="pt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6AFF00" fill-opacity=".9"/>
    </marker>
  </defs>

  <rect width="600" height="450" fill="#06140a"/>
  <rect width="600" height="450" fill="url(#pt-grid)"/>
  <rect width="600" height="450" fill="url(#pt-glow)"/>

  <text class="mono" x="300" y="62" font-size="24" fill="#7fcc66" text-anchor="middle">multiplexed</text>

  <!-- lambda containers -->
  <g>
    <rect x="40" y="110" width="86" height="52" rx="12" fill="#0b1f0a" stroke="#173311" stroke-width="2"/>
    <rect x="40" y="176" width="86" height="52" rx="12" fill="#0b1f0a" stroke="#173311" stroke-width="2"/>
    <rect x="40" y="242" width="86" height="52" rx="12" fill="#0b1f0a" stroke="#173311" stroke-width="2"/>
    <rect x="40" y="308" width="86" height="52" rx="12" fill="#0b1f0a" stroke="#173311" stroke-width="2"/>
  </g>
  <g class="mono" font-size="27" fill="#6AFF00" text-anchor="middle">
    <text x="83" y="146">&#955;</text><text x="83" y="212">&#955;</text>
    <text x="83" y="278">&#955;</text><text x="83" y="344">&#955;</text>
  </g>

  <!-- funnel into the proxy -->
  <g class="flow" fill="none" stroke="#6AFF00" stroke-opacity=".45" stroke-width="2.4">
    <path d="M126 136 C200 136 216 208 250 216"/>
    <path d="M126 202 C200 202 216 224 250 228"/>
    <path d="M126 268 C200 268 216 246 250 242"/>
    <path d="M126 334 C200 334 216 264 250 254"/>
  </g>

  <!-- proxy -->
  <rect x="250" y="198" width="150" height="74" rx="37" fill="#0b1f0a" stroke="#6AFF00" stroke-opacity=".65" stroke-width="2"/>
  <text class="mono" x="325" y="243" font-size="26" fill="#6AFF00" text-anchor="middle">proxy</text>

  <!-- single stable link -->
  <path d="M400 235 H466" fill="none" stroke="#6AFF00" stroke-opacity=".7" stroke-width="2.8" marker-end="url(#pt-arrow)"/>

  <!-- postgres -->
  <g>
    <ellipse cx="530" cy="208" rx="52" ry="16" fill="#0b1f0a" stroke="#173311" stroke-width="2"/>
    <path d="M478 208v54c0 8.8 23.3 16 52 16s52-7.2 52-16v-54" fill="#0b1f0a" stroke="#173311" stroke-width="2"/>
    <ellipse cx="530" cy="208" rx="52" ry="16" fill="none" stroke="#6AFF00" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <text class="mono" x="300" y="404" font-size="24" fill="#eefff0" text-anchor="middle">many &#955; &#183; few conns</text>
</svg>
